# Anything that isn't one of our hostnames gets nothing. The API trusts the Host
# header nginx passes on, so only known hosts may reach it.
server {
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/mobilephoneinventory.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mobilephoneinventory.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 444;
}

server {
  listen 80 default_server;
  server_name _;
  return 444;
}

# Primary app — inventory subdomains (same web + API).
# fonex / sanabil: organizations (each signs in only on the domain assigned to it).
# admin: the platform super admin.
server {
  listen 443 ssl;
  server_name sanabil.mobilephoneinventory.com fonex.mobilephoneinventory.com admin.mobilephoneinventory.com;

  ssl_certificate /etc/letsencrypt/live/mobilephoneinventory.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mobilephoneinventory.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Apex domains — no redirect to subdomain (landing page TBD)
server {
  listen 443 ssl;
  server_name mobilephoneinventory.com www.mobilephoneinventory.com;

  ssl_certificate /etc/letsencrypt/live/mobilephoneinventory.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mobilephoneinventory.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 404;
}

server {
  listen 80;
  server_name mobilephoneinventory.com www.mobilephoneinventory.com;
  return 301 https://$host$request_uri;
}

server {
  listen 80;
  server_name sanabil.mobilephoneinventory.com fonex.mobilephoneinventory.com admin.mobilephoneinventory.com;
  return 301 https://$host$request_uri;
}
